<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixboxing Photo Gallery</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

header {
    background: #151b35;
    color: white;
    text-align: center;
    padding: 25px;
}

h2 {
    text-align: center;
    color: #c6283b;
    margin: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.03);
}

.pagination {
    text-align: center;
    padding: 25px;
}

.pagination button {
    background: #c6283b;
    color: white;
    border: none;
    padding: 10px 16px;
    margin: 5px;
    cursor: pointer;
    border-radius: 5px;
}

.pagination button.active {
    background: #151b35;
}

.pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

@media(max-width: 700px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 400px) {
    .gallery img {
        height: 140px;
    }
}
</style>
</head>

<body>

<header>
    <h1>MIXBOXING STATE ASSOCIATION</h1>
    <p>MAHARASHTRA</p>
</header>

<h2>Gallery – Photos</h2>

<div class="gallery" id="gallery"></div>

<div class="pagination" id="pagination"></div>

<script>

// Add your photo names here
const photos = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg",
    "images/photo5.jpg",
    "images/photo6.jpg",
    "images/photo7.jpg",
    "images/photo8.jpg",
    "images/photo9.jpg",
    "images/photo10.jpg",
    "images/photo11.jpg",
    "images/photo12.jpg"
];

const perPage = 8;
let currentPage = 1;

function showGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    const start = (currentPage - 1) * perPage;
    const end = start + perPage;

    photos.slice(start, end).forEach(photo => {
        const img = document.createElement("img");
        img.src = photo;
        img.alt = "Mixboxing Event Photo";
        img.onclick = () => window.open(photo, "_blank");
        gallery.appendChild(img);
    });

    showPagination();
}

function showPagination() {
    const pages = Math.ceil(photos.length / perPage);
    const pagination = document.getElementById("pagination");

    pagination.innerHTML = "";

    const prev = document.createElement("button");
    prev.textContent = "Previous";
    prev.disabled = currentPage === 1;
    prev.onclick = () => {
        currentPage--;
        showGallery();
    };
    pagination.appendChild(prev);

    for (let i = 1; i <= pages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = i === currentPage ? "active" : "";
        btn.onclick = () => {
            currentPage = i;
            showGallery();
        };
        pagination.appendChild(btn);
    }

    const next = document.createElement("button");
    next.textContent = "Next";
    next.disabled = currentPage === pages;
    next.onclick = () => {
        currentPage++;
        showGallery();
    };
    pagination.appendChild(next);
}

showGallery();

</script>

</body>
</html>
